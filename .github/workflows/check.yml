name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tradebox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile tradebox.py esp32_manager.py session_control.py startup_checks.py bank_backend.py bank_client.py bank_ui.py
      - name: Check launcher scripts
        run: bash -n install.sh start-tradebox.sh
      - name: Test startup, shutdown, and radio operation coordination
        run: python -m unittest discover -s tests -v
      - name: Install GTK for touchscreen layout check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 xvfb xauth dbus-x11
      - name: Render Bank pages at 800x480
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: '1'
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -u tests/smoke_bank_ui.py
